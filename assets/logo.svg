<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a5af8"/>
      <stop offset="0.55" stop-color="#5865f2"/>
      <stop offset="1" stop-color="#16a9e6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1b1446" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#shine)"/>

  <!-- play glyph, slightly right of centre so it reads optically centred -->
  <path filter="url(#shadow)" fill="#fff" transform="translate(-24 -8)"
        d="M196 150 C196 128 219 115 238 126 L370 203 C389 214 389 241 370 252 L238 329 C219 340 196 327 196 305 Z"/>

  <!-- "now playing" status dot, cut out of the tile -->
  <circle cx="384" cy="384" r="84" fill="#1e1f3b"/>
  <circle cx="384" cy="384" r="58" fill="#3ecf6e"/>
  <g fill="#fff">
    <rect x="356" y="366" width="11" height="36" rx="5.5"/>
    <rect x="378" y="356" width="11" height="56" rx="5.5"/>
    <rect x="400" y="372" width="11" height="24" rx="5.5"/>
  </g>
</svg>
