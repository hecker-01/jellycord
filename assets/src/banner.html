<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Source for assets/banner.png (1280x720). Render with headless Chrome; see assets/README.md. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #f4f4fb;
    background:
      radial-gradient(900px 600px at 12% 20%, rgba(122, 90, 248, .45), transparent 60%),
      radial-gradient(800px 600px at 95% 100%, rgba(22, 169, 230, .35), transparent 60%),
      #13131f;
    display: flex; align-items: center; justify-content: center; gap: 72px;
    padding: 0 80px;
  }
  .brand { display: flex; flex-direction: column; gap: 28px; max-width: 640px; }
  .brand img { width: 168px; height: 168px; filter: drop-shadow(0 18px 40px rgba(20, 10, 70, .55)); }
  h1 { font-size: 104px; font-weight: 800; letter-spacing: -3px; line-height: .95; }
  .tag { font-size: 34px; line-height: 1.3; color: #c9c9e3; }
  .tag b { color: #fff; font-weight: 700; }
  .pills { display: flex; gap: 12px; flex-wrap: nowrap; white-space: nowrap; }
  .pill { font-size: 20px; padding: 8px 16px; border-radius: 999px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14); color: #dedef2; }

  /* stylised status card */
  .card {
    width: 470px; flex: none; border-radius: 24px; padding: 26px 28px 30px;
    background: linear-gradient(160deg, #2a2340, #1d1a2e);
    border: 1px solid rgba(255, 255, 255, .1);
    box-shadow: 0 40px 80px rgba(0, 0, 0, .5);
    transform: rotate(-2deg);
  }
  .card .label { font-size: 20px; font-weight: 700; color: #e6e6f5; margin-bottom: 18px; }
  .card .row { display: flex; gap: 22px; align-items: center; }
  .poster {
    width: 132px; height: 132px; border-radius: 14px; flex: none; position: relative; overflow: hidden;
    background: linear-gradient(150deg, #f6b25d, #e9653f 45%, #6a2c8f);
  }
  .poster::before { content: ""; position: absolute; inset: auto -20% -35% -20%; height: 70%; background: #2d6a3e; border-radius: 50% 50% 0 0; }
  .poster::after { content: ""; position: absolute; width: 46px; height: 46px; border-radius: 50%; background: #ffe7a3; top: 20px; right: 22px; box-shadow: 0 0 30px #ffd36b; }
  .meta { min-width: 0; flex: 1; }
  .title { font-size: 28px; font-weight: 800; }
  .sub { font-size: 20px; color: #bdbdd6; margin: 4px 0 18px; }
  .bar { display: flex; align-items: center; gap: 12px; font: 600 18px ui-monospace, Consolas, monospace; color: #e8e8f4; }
  .track { flex: 1; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .18); overflow: hidden; }
  .track i { display: block; width: 38%; height: 100%; background: #fff; border-radius: 3px; }
</style>
</head>
<body>
  <div class="brand">
    <img src="../logo.svg" alt="">
    <h1>Jellycord</h1>
    <p class="tag">Your <b>Jellyfin</b> playback as your <b>Discord</b> status.</p>
    <div class="pills">
      <span class="pill">Posters</span>
      <span class="pill">Progress bar</span>
      <span class="pill">Any device</span>
      <span class="pill">No desktop app</span>
    </div>
  </div>

  <div class="card">
    <div class="label">Watching Big Buck Bunny</div>
    <div class="row">
      <div class="poster"></div>
      <div class="meta">
        <div class="title">Big Buck Bunny</div>
        <div class="sub">2008 · Jellyfin</div>
        <div class="bar"><span>03:48</span><span class="track"><i></i></span><span>09:56</span></div>
      </div>
    </div>
  </div>
</body>
</html>
