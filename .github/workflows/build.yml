name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions are pinned to commit SHAs (tags can be moved); Dependabot keeps them current
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Jellycord.sln --locked-mode
      - name: Check for vulnerable packages
        run: |
          dotnet list Jellycord.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
      - run: dotnet test Jellycord.sln -c Release --no-restore
      - run: dotnet publish src/Jellyfin.Plugin.Jellycord -c Release -o out --no-restore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jellycord-dll
          path: out/Jellyfin.Plugin.Jellycord.dll
