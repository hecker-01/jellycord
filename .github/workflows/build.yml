name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test Jellycord.sln -c Release
      - run: dotnet publish src/Jellyfin.Plugin.Jellycord -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: jellycord-dll
          path: out/Jellyfin.Plugin.Jellycord.dll
